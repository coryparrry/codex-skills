- required implementer action:

## Missing Evidence

Name exact files, commands, screenshots, logs, tests, or owner decisions needed before this can pass.

## Final Instruction To Implementer

State whether the implementer may proceed to task_completion_review_critic. If not PASS, explicitly say the phase/slice must remain open. If PASS, explicitly say the implementer must not mark complete until the critic returns AGREE_PASS.
"""
