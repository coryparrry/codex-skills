## Evidence Checked

| Evidence | Present? | Notes |
|---|---|---|
| Acceptance criteria |  |  |
| Current branch/status |  |  |
| Changed files/diff, including untracked files |  |  |
| Touched files and deliberate non-touches |  |  |
| Changed user/API/schema/docs/runtime behavior |  |  |
| Security/privacy/auth/exposure risks or N/A reason |  |  |
| Acceptance traceability |  |  |
| Validation environment |  |  |
| Deferred follow-ups or N/A reason |  |  |
| Raw validation artifact or safe rerun proof |  |  |
