## Forbidden fix patterns

- Do not satisfy a finding by adding a warning/comment only.
- Do not silence errors with empty catch blocks, broad `except`, fallback-to-empty JSON/state, `Promise.catch(() => ...)`, unchecked `try/except/pass`, or best-effort cleanup on risky paths.
- Do not fix only the reviewer's exact example while leaving obvious adjacent missing/malformed/expired/duplicate/unauthorized/released/unsupported states untested.
- Do not make UI/API callers merely hide the unsafe action if the repository/service path still accepts it.
- Do not replace a concrete invariant with a looser type, `any`, `unknown`, `object`, `dict[str, Any]`, or `# type: ignore` unless the analysis proves it is safe and locally required.
- Do not add dependencies, generated clients, migrations, package-manager changes, or lockfile changes unless explicitly approved.

## Closeout response

Return: files changed, finding IDs fixed, invariant enforced, red/green evidence, commands run, remaining risks, blocked validations, matrix paths, and any required post-fix auditor handoff.

